server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Routes such as /analytics only exist in the Angular app, so unknown paths get index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The production build calls /api, which goes to the json-server container (the "api" service
  # in docker-compose.yml). The trailing slash drops the /api prefix: /api/tasks becomes /tasks.
  location /api/ {
    proxy_pass http://api:3030/;
  }

  # Routes such as /analytics only exist in the Angular app, so unknown paths get index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}

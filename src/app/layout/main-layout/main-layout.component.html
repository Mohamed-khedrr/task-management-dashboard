<app-header (menuToggle)="menuOpen.set(true)" />

<div class="layout">
  <aside class="sidebar">
    <app-sidebar-nav />
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>

@defer (when menuOpen()) {
  <p-drawer
    [(visible)]="menuOpen"
    [position]="drawerPosition()"
    [header]="appInfo.nameKey | transloco"
    [ariaCloseLabel]="'layout.closeMenu' | transloco"
  >
    <app-sidebar-nav (linkSelected)="menuOpen.set(false)" />
  </p-drawer>
}

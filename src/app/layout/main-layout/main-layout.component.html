<app-header (menuToggle)="menuOpen.set(true)" />

<div class="layout">
  <aside class="sidebar">
    <app-sidebar-nav (newTask)="taskDialog.openCreate()" />
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>

@defer (when menuOpen()) {
  <p-drawer
    [(visible)]="menuOpen"
    [position]="drawerPosition()"
    [header]="appInfo.nameKey | transloco"
    [ariaCloseLabel]="'layout.closeMenu' | transloco"
  >
    <app-sidebar-nav (linkSelected)="menuOpen.set(false)" (newTask)="taskDialog.openCreate()" />
  </p-drawer>
}

@defer (when taskDialog.isOpen()) {
  <app-task-dialog />
}

<p-toast [position]="toastPosition()" />

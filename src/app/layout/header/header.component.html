<header class="header">
  <button
    type="button"
    class="menu-button"
    [attr.aria-label]="'layout.openMenu' | transloco"
    (click)="menuToggle.emit()"
  >
    <span aria-hidden="true">☰</span>
  </button>

  <a routerLink="/dashboard" class="brand">
    <span class="brand-logo" aria-hidden="true">{{ appInfo.logo }}</span>
    <span class="brand-title">{{ appInfo.nameKey | transloco }}</span>
  </a>
  <div class="search">
    @if (search.scope(); as scope) {
      <input
        pInputText
        type="search"
        class="search-input"
        [value]="search.text()"
        (input)="onSearch($event)"
        [attr.aria-label]="'header.search.' + scope + '.label' | transloco"
        [placeholder]="'header.search.' + scope + '.placeholder' | transloco"
      />
    }
  </div>

  <div class="actions">
    <span
      class="avatar"
      role="img"
      [attr.aria-label]="profile.name() || ('header.profile' | transloco)"
    >
      {{ profile.initials() || 'UK' }}
    </span>
  </div>
</header>

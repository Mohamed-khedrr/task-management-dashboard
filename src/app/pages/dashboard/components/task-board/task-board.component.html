<section
  class="board"
  cdkDropListGroup
  cdkScrollable
  [attr.aria-label]="'dashboard.board' | transloco"
>
  @for (column of columns(); track column.status) {
    <app-task-column
      [status]="column.status"
      [tasks]="column.tasks"
      (taskMoved)="moveTask($event)"
      (taskOpened)="taskDialog.openEdit($event)"
    />
  }
</section>

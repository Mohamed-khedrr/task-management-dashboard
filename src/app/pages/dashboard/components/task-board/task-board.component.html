<section
  class="board"
  cdkDropListGroup
  cdkScrollable
  [attr.aria-label]="'dashboard.board' | transloco"
>
  @for (column of columns(); track column.status) {
    <app-task-column
      [status]="column.status"
      [tasks]="column.tasks"
      [deletingIds]="deletingIds()"
      (taskMoved)="taskMoved.emit($event)"
      (taskEdit)="taskDialog.openEdit($event.id)"
      (taskDelete)="confirmDelete($event)"
    />
  }
</section>

<p-confirmdialog />

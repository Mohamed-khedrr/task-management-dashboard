<section class="column" [attr.aria-labelledby]="'column-' + status()">
  <header class="header">
    <h2 class="title" [id]="'column-' + status()">{{ 'task.status.' + status() | transloco }}</h2>
    <span class="count">{{ tasks().length }}</span>
  </header>

  @if (tasks().length > 0) {
    <ul class="list">
      @for (task of tasks(); track task.id) {
        <li animate.enter="card-enter">
          <app-task-card [task]="task" />
        </li>
      }
    </ul>
  } @else {
    <p class="empty">{{ 'task.noTasks' | transloco }}</p>
  }
</section>

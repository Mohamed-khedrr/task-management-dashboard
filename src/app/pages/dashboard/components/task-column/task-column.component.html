<section
  class="column"
  [attr.aria-labelledby]="'column-' + status()"
  cdkDropList
  cdkDropListSortingDisabled
  [cdkDropListData]="status()"
  (cdkDropListDropped)="onDrop($event)"
>
  <header class="header">
    <h2 class="title" [id]="'column-' + status()">{{ 'task.status.' + status() | transloco }}</h2>
    <span class="count" aria-hidden="true">{{ tasks().length }}</span>
    <span class="visually-hidden">{{ 'task.count' | transloco: { count: tasks().length } }}</span>
  </header>

  @if (tasks().length > 0) {
    <ul class="list">
      @for (task of tasks(); track task.id) {
        @let deleting = deletingIds().includes(task.id);
        <li
          animate.enter="card-enter"
          cdkDrag
          [cdkDragDisabled]="deleting"
          [cdkDragData]="task"
          [cdkDragStartDelay]="{ touch: 200, mouse: 0 }"
        >
          <app-task-card
            [task]="task"
            [deleting]="deleting"
            (editRequested)="taskEdit.emit(task)"
            (deleteRequested)="taskDelete.emit(task)"
          />
        </li>
      }
    </ul>
  } @else {
    <p class="empty">{{ 'task.noTasks' | transloco }}</p>
  }
</section>

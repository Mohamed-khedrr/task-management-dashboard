<h1 class="page-title">{{ 'analytics.title' | transloco }}</h1>

@if (error()) {
  <div class="state" role="alert">
    <p-message severity="error">{{ 'dashboard.error' | transloco }}</p-message>
    <p-button [label]="'dashboard.retry' | transloco" (onClick)="retry()" />
  </div>
} @else if (isLoading()) {
  <div class="charts" aria-busy="true">
    <p-skeleton height="400px" borderRadius="8px" />
    <p-skeleton height="400px" borderRadius="8px" />
    <p-skeleton class="wide" height="320px" borderRadius="8px" />
    <p-skeleton class="wide" height="480px" borderRadius="8px" />
  </div>
} @else if (hasNoTasks()) {
  <p class="state">{{ 'analytics.noTasks' | transloco }}</p>
} @else {
  <div class="charts">
    <app-chart-card
      kind="doughnut"
      [title]="'analytics.byStatus' | transloco"
      [items]="statusItems()"
      [rtl]="isRtl()"
    />
    <app-chart-card
      kind="bar"
      [title]="'analytics.timeliness' | transloco"
      [items]="timelinessItems()"
      [rtl]="isRtl()"
    />
    <app-chart-card
      class="wide"
      kind="horizontalBar"
      [title]="'analytics.byPriority' | transloco"
      [items]="priorityItems()"
      [rtl]="isRtl()"
    />
    <app-stacked-bar-card
      class="wide"
      [title]="'analytics.overdueByPerson' | transloco"
      [labels]="overdueLabels()"
      [series]="overdueSeries()"
      [rtl]="isRtl()"
    />
    <app-stacked-bar-card
      class="wide"
      [title]="'analytics.byPerson' | transloco"
      [labels]="personLabels()"
      [series]="personSeries()"
      [rtl]="isRtl()"
    />
  </div>
}

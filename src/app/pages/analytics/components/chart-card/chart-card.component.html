<section class="card" [attr.aria-labelledby]="titleId">
  <h2 class="title" [id]="titleId">{{ title() }}</h2>

  <div class="chart" [class.short]="isHorizontal()">
    <p-chart
      [type]="chartType()"
      [data]="data()"
      [options]="options()"
      [ariaLabel]="summary()"
      height="100%"
    />
  </div>

  <app-chart-legend [items]="items()" />
</section>

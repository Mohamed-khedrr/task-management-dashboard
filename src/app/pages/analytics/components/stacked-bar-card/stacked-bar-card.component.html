<section class="card" [attr.aria-labelledby]="titleId">
  <h2 class="title" [id]="titleId">{{ title() }}</h2>

  <div class="scroll" tabindex="0" [attr.aria-labelledby]="titleId">
    <div class="chart" [style.min-width.px]="chartWidth()">
      <p-chart
        type="bar"
        [data]="data()"
        [options]="options()"
        [ariaLabel]="summary()"
        height="100%"
      />
    </div>
  </div>

  <app-chart-legend [items]="legend()" />
</section>
